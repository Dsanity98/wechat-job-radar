name: Sync Job Radar

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore sync point
        uses: actions/cache@v4
        with:
          path: data/radar/.last-sync.txt
          key: jobradar-sync-point-v1
          restore-keys: jobradar-sync-point-

      - name: Install Python dependency
        run: python -m pip install --upgrade "jobsearchradar[mcp]==2.2.1"

      - name: Install CloudBase CLI
        run: npm install --prefix tools/cloudbase-cli --no-audit --no-fund

      - name: Login CloudBase
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          CLOUDBASE_ENV_ID: cloud1-d5gozm7zv06d1d98f
          HOME: /tmp/cloudbase-home
          XDG_CONFIG_HOME: /tmp/cloudbase-config
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          ./tools/cloudbase-cli/node_modules/.bin/tcb login \
            --cloudbase-api-key "$CLOUDBASE_API_KEY" \
            -e "$CLOUDBASE_ENV_ID"

      - name: Update snapshot and apply delta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          CLOUDBASE_ENV_ID: cloud1-d5gozm7zv06d1d98f
          CLOUDBASE_CLI_BIN: ${{ github.workspace }}/tools/cloudbase-cli/node_modules/.bin/tcb
          CLOUDBASE_HOME: /tmp/cloudbase-home
          CLOUDBASE_CONFIG: /tmp/cloudbase-config
          JOBRADAR_HOME: /tmp/jobradar_home
        run: |
          python -m jobradar update --jobs-only
          python tools/sync-radar-delta.py
